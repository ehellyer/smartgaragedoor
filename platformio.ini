; =============================================================================
;  PlatformIO Project Configuration
;  Smart Garage Door Controller — ESP32 + Security+ 2.0 + Apple HomeKit
; =============================================================================

[platformio]
src_dir = src           ; All source files live in the src/ directory
description = Smart Garage Door Controller

; ── Common settings shared across all environments ───────────────────────────
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board = esp32dev

; min_spiffs gives ~1.875MB per OTA slot (vs 1.25MB in default.csv),
; enough for HomeSpan + arduino-esp32 3.x while keeping two OTA slots and NVS.
board_build.partitions = min_spiffs.csv

; ── Library dependencies ─────────────────────────────────────────────────────
; PlatformIO will automatically clone and build these on first compile.
lib_deps =
    https://github.com/HomeSpan/HomeSpan.git   ; Native ESP32 HomeKit (HAP R2)
    https://github.com/argilo/secplus.git      ; Security+ 2.0 wireline codec

; ── Build flags ──────────────────────────────────────────────────────────────
build_flags =
    -DARDUINO_ARCH_ESP32          ; Required by HomeSpan for platform detection
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192  ; Larger stack — HomeSpan + UART + NVS
    -Os                           ; Optimize for size

; =============================================================================
;  Environment: Generic ESP32 DevKit (38-pin, ESP32-WROOM-32)
;  Use this if you have a standard 38-pin ESP32 development board.
; =============================================================================
[env:esp32dev]
; ── USB upload — use this for initial flash or if WiFi is unavailable ─────────
upload_speed  = 921600

; =============================================================================
;  OTA environment — use this for all subsequent uploads once device is on WiFi
;  Select in VS Code: bottom toolbar → switch environment → "esp32dev-ota"
; =============================================================================
[env:esp32dev-ota]

upload_protocol   = espota
upload_port       = 192.168.78.190
monitor_port      = socket://192.168.78.190:23 
